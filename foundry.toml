[profile.default]
# Monad execution environment: Monad gas model, opcode pricing, transaction rules,
# precompiles (incl. P256 at 0x0100), 128KB contract size limit, MIP-8 page-based storage.
# Requires Foundry >= v1.8.0. See research/foundry.md
network = "monad"
hardfork = "monad:MonadTen"

src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Required for the 12-field Stream struct + deep test destructuring.
via_ir = true

fs_permissions = [{ access = "read", path = "./broadcast" }]

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", url = "https://api.monadscan.com/api" }

# NOTE (Monad gotcha): transactions are charged on the DECLARED gas limit, not gas used.
# total deducted = value + gas_bid * gas_limit. Always pass explicit gas values from the
# relayer; never let an estimate stand. See research/differences.md
